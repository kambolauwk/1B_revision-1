function tone(win){
  if(muted)return;
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  try{
    audio ||= new Context(); audio.resume().catch(()=>{});
    const start=audio.currentTime;
    (win?[523,659,784]:[330,247]).forEach((frequency,index)=>{
      const oscillator=audio.createOscillator(),gain=audio.createGain(),time=start+index*.10;
      oscillator.type='triangle';oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(.11,time);gain.gain.exponentialRampToValueAtTime(.001,time+.16);
      oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(time);oscillator.stop(time+.17);
    });
  }catch{}
}

function artwork(kind){
  const image=element('img','picture');
  image.src=illustrations[kind];
  image.width=508;
  image.height=508;
  image.alt='';
  return image;
}
function accept(correct,control){
  if(solved)return;
  tone(correct);
  if(!correct){status.textContent='再試一次！';if(control)control.classList.add('bad');return;}
  solved=true;score++;status.textContent=question===2?'答對了！這一關完成！':'答對了！獲得一枚金幣！';
  content.querySelectorAll('.bad').forEach(b=>b.classList.remove('bad'));
  if(control)control.classList.add('good');
  content.querySelectorAll('button').forEach(b=>b.disabled=true);
  updateProgress();next.hidden=false;
  next.textContent=question<2?'下一題':stage<2?'下一關':'看闖關結果';next.focus();
}
function updateProgress(){
  $('coins').textContent=`🪙 金幣 ${score}／9`;
  $('runner').style.left=`${score*10}%`;
}
function render(){
  solved=false;selected=[];status.textContent='';next.hidden=true;content.replaceChildren();updateProgress();
  document.querySelectorAll('.course li').forEach((li,i)=>{li.classList.toggle('done',i<stage);if(i===stage)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');});
  $('count').textContent=stage===3?'三關完成':`第 ${question+1} 題／共 3 題`;
  $('heading').textContent=['第一關　詞語配對','第二關　看圖辨析','第三關　重組句子','成功闖過三關！'][stage];
  $('instruction').textContent=['讀一讀詞語，選出相符的圖片。','看看圖片和詞語，選「正確」或「錯誤」。','依次點選詞語和句號，再按「檢查」。',''][stage];
  if(stage===0){
    const prompt=element('div','prompt',match[question]),row=element('div','pictures');
    const choices=[[1,0,2],[2,0,1],[2,1,0]][question];
    choices.forEach((id,i)=>{const b=button('','',()=>accept(id===question,b));b.setAttribute('aria-label',`圖片 ${i+1}`);b.append(artwork(match[id]));row.append(b);});
    content.append(prompt,row);
  }else if(stage===1){
    const [word,picture]=judge[question];const row=element('div','row');row.style.marginTop='12px';
    [true,false].forEach(value=>{const b=button(value?'✓ 正確':'✕ 錯誤','action '+(value?'secondary':''),()=>accept(value===(word===picture),b));row.append(b);});
    content.append(element('div','prompt',word),artwork(picture),row);
  }else if(stage===2){
    const sentence=sentences[question],slots=element('div','row slots'),tiles=element('div','row');
    const actions=element('div','row');actions.style.marginTop='16px';
    const check=button('檢查','action',()=>accept(selected.every((id,i)=>id===i),check));
    const reset=button('清空','action secondary',()=>{selected=[];refresh();tiles.firstElementChild.focus();});
    function refresh(){
      slots.replaceChildren();status.textContent='';check.classList.remove('bad');
      if(!selected.length)slots.append(element('span','slot-empty','在這裏排句子'));
      selected.forEach(id=>slots.append(button(sentence[id],'tile secondary',()=>{selected=selected.filter(item=>item!==id);refresh();tiles.querySelector(`[data-id="${id}"]`).focus();})));
      tiles.querySelectorAll('button').forEach(b=>b.disabled=selected.includes(Number(b.dataset.id)));
      check.disabled=selected.length!==sentence.length;reset.disabled=!selected.length;
    }
    order[question].forEach(id=>{const b=button(sentence[id],'tile',()=>{selected.push(id);refresh();(tiles.querySelector('button:not(:disabled)')||check).focus();});b.dataset.id=id;tiles.append(b);});
    actions.append(reset,check);content.append(slots,tiles,actions);refresh();
  }else{
    content.append(element('div','winner','🏆'),element('p','instruction','你集齊了 9 枚金幣！'));
    next.textContent='再玩一次';next.hidden=false;tone(true);
  }
  $('heading').focus();
}
next.addEventListener('click',()=>{
  if(stage===3){stage=0;question=0;score=0;}
  else if(question===2){stage++;question=0;}
  else question++;
  render();
});
$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'音效關':'音效開';$('sound').setAttribute('aria-pressed',String(!muted));});
render();
</script></body></html>
